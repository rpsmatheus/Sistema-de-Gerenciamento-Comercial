{% extends 'base.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <div class="mx-auto mt-8 max-w-sm rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
        <h1 class="text-xl font-bold text-stone-900">Entrar no sistema</h1>
        <p class="mt-1 text-sm text-stone-600">Acesso restrito ao gerente.</p>

        {% if form.errors %}
            <div class="mensagem mensagem-error mt-4" role="alert">
                Usuário ou senha incorretos. Tente novamente.
            </div>
        {% endif %}

        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-stone-700">
                    Usuário
                </label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}"
                       value="{{ form.username.value|default:'' }}"
                       autocomplete="username" autofocus required
                       class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600">
            </div>

            <div>
                <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-stone-700">
                    Senha
                </label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}"
                       autocomplete="current-password" required
                       class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2 focus:border-amber-600 focus:outline-none focus:ring-1 focus:ring-amber-600">
            </div>

            <button type="submit"
                    class="w-full rounded-lg bg-amber-800 px-4 py-2 font-medium text-white hover:bg-amber-700">
                Entrar
            </button>
        </form>
    </div>
{% endblock %}
